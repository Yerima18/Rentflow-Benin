name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-build-and-demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build in production demo mode without a database
        run: VERCEL_ENV=production DEMO_MODE=true npm run vercel-build
      - run: npm run smoke:demo
